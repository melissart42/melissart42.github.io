            /* Dark mode variables */
            :root {
                --colorWhite: #ffffff;
                --colorBlack: #000000;

                --colorSecondary: #12bdff;

            [data-theme="dark"] {
                --colorWhite: #000000;

                --colorTextInverted: #000000;
                --colorTextLight: #aaaaaa;

                --colorSurface: #16213e;

            }
            [data-theme="dark"] .nav__item a:hover,
            [data-theme="dark"] .footer .nav__item a:hover {

            /* Art Gallery Styles */
            .art-gallery {
                display: grid;
                grid-template-columns: 1fr 300px;
                gap: 2rem;
                padding: 2rem 0;
            }
            @media (max-width: 1024px) {
                .art-gallery {
                    grid-template-columns: 1fr;
                }
            }
            .art-viewer {
                position: sticky;
                top: 2rem;
                height: calc(100vh - 4rem);
            }
            .art-viewer img {
                width: 100%;
                height: 100%;
                object-fit: contain;
                border-radius: 8px;
                box-shadow: 0 4px 24px rgba(0,0,0,0.1);
            }
            [data-theme="dark"] .art-viewer img {
                box-shadow: 0 4px 24px rgba(0,0,0,0.4);
            }
            .art-viewer-placeholder {
                width: 100%;
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                color: var(--colorTextLight);
                font-family: var(--fontFamilyHandwritten);
                font-size: 1.5rem;
                border: 2px dashed var(--colorGrey);
                border-radius: 8px;
            }
            .art-thumbnails {
                display: flex;
                flex-direction: column;
                gap: 1rem;
                max-height: calc(100vh - 4rem);
                overflow-y: auto;
            }
            .art-album-nav {
                display: flex;
                flex-wrap: wrap;
                gap: 0.5rem;
                margin-bottom: 2rem;
                padding-bottom: 1rem;
                border-bottom: 1px solid var(--colorGreyLight);
            }
            .art-album-link {
                padding: 0.5rem 1rem;
                background: var(--colorGreyLight);
                border-radius: 2rem;
                font-family: var(--fontFamilyHeading);
                font-size: 0.875rem;
                color: var(--colorTextDefault);
                text-decoration: none;
                transition: all 0.2s ease;
                cursor: pointer;
            }
            .art-album-link:hover,
            .art-album-link.active {
                background: var(--colorPrimary);
                color: var(--colorWhite);
            }
            [data-theme="dark"] .art-album-link {
                background: var(--colorGrey);
            }
            [data-theme="dark"] .art-album-link:hover,
            [data-theme="dark"] .art-album-link.active {
                background: var(--colorPrimary);
            }
            .art-thumb {
                width: 100%;
                aspect-ratio: 4/3;
                object-fit: cover;
                border-radius: 4px;
                cursor: pointer;
                transition: transform 0.2s ease, box-shadow 0.2s ease;
                border: 2px solid transparent;
            }
            .art-thumb:hover {
                transform: scale(1.02);
                box-shadow: 0 4px 16px rgba(0,0,0,0.15);
            }
            .art-thumb.active {
                border-color: var(--colorPrimary);
            }
            .art-caption {
                margin-top: 0.5rem;
                font-size: 0.75rem;
                color: var(--colorTextLight);
                font-family: var(--fontFamilyHandwritten);
            }
            .art-caption-title {
                font-weight: 600;
                color: var(--colorTextDefault);

            }
            .art-info {

                background: var(--colorGreyLight);
                border-radius: 8px;

            .art-info-title {

            }
            .art-info-subtitle {
                font-family: var(--fontFamilyHandwritten);
                color: var(--colorTextLight);
                font-size: 0.875rem;
            }

    <script>
        (function() {
            // Language toggle
            const langToggle = document.getElementById('langToggle');
            const langSpans = langToggle ? langToggle.querySelectorAll('[data-lang]') : [];
            let currentLang = 'fr';

            const translations = {
                fr: {
                    nav: { about: 'À propos', games: 'Jeux', blog: 'Blog', art: 'Art' },
                    hero: { 
                        title: { part1: 'Bienvenue', part2: 'melissart' }, 
                        subtitle: 'Portfolio de design numérique & typographie. Étudiante passionnée par la création de polices et le processus créatif.', 
                        cta: 'À propos de Mellisa' 
                    },
                    blog: { title: 'Blog', readMore: 'Lire la suite', latest: 'Derniers articles', back: '← Retour au blog' }
                },
                en: {
                    nav: { about: 'About', games: 'Games', blog: 'Blog', art: 'Art' },
                    hero: { 
                        title: { part1: 'Welcome', part2: 'melissart' }, 
                        subtitle: 'Digital design & typography portfolio. Student passionate about font creation and creative process.', 
                        cta: 'About Mellisa' 
                    },
                    blog: { title: 'Blog', readMore: 'Read more', latest: 'Latest Articles', back: '← Back to blog' }
                }
            };

            function applyLanguage(lang) {
                document.documentElement.lang = lang;
                document.querySelectorAll('[data-i18n]').forEach(el => {
                    const key = el.dataset.i18n;
                    const keys = key.split('.');
                    let value = translations[lang];
                    for (const k of keys) { value = value?.[k]; }
                    if (value) el.textContent = value;
                });
                langSpans.forEach(s => s.style.display = s.dataset.lang === lang ? '' : 'none');
                currentLang = lang;
                localStorage.setItem('lang', lang);
            }

            if (langToggle) {
                langToggle.addEventListener('click', () => {
                    applyLanguage(currentLang === 'fr' ? 'en' : 'fr');
                });
            }

            // Dark mode toggle
            const themeToggle = document.getElementById('themeToggle');
            const themeSpans = themeToggle ? themeToggle.querySelectorAll('[data-theme]') : [];

            function applyTheme(theme) {
                document.documentElement.setAttribute('data-theme', theme);
                themeSpans.forEach(s => s.style.display = s.dataset.theme === theme ? '' : 'none');
                localStorage.setItem('theme', theme);
            }

            if (themeToggle) {
                themeToggle.addEventListener('click', () => {
                    const current = document.documentElement.getAttribute('data-theme') || 'light';
                    applyTheme(current === 'light' ? 'dark' : 'light');
                });
            }

            // Initialize from localStorage
            const savedLang = localStorage.getItem('lang');
            if (savedLang) applyLanguage(savedLang);

            const savedTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
            applyTheme(savedTheme);

            // Art Gallery Logic
            const albums = {
                typographie: {
                    title: "Typography",
                    images: [
                        { src: "/assets/img/jeunecrack.svg", thumb: "/assets/img/jeunecrack.svg", title: "JeuneCrack", subtitle: "Police pour programme cybersec", date: "2026" },
                        { src: "/assets/img/affiche-typo.svg", thumb: "/assets/img/affiche-typo.svg", title: "Affiche Typographique", subtitle: "Expérimentation typographique", date: "2026" },
                        { src: "/assets/img/cafe-identite.svg", thumb: "/assets/img/cafe-identite.svg", title: "Identité Café", subtitle: "Lettering & branding", date: "2025" }
                    ]
                },
                illustrations: {
                    title: "Illustrations",
                    images: [
                        { src: "/assets/img/steallikeaartiste.jpg", thumb: "/assets/img/steallikeaartiste.jpg", title: "Voler comme un artiste", subtitle: "Illustration inspirée du livre", date: "2026" }
                    ]
                },
                digital: {
                    title: "Digital Art",
                    images: [
                        { src: "/assets/img/steallikeaartiste.jpg", thumb: "/assets/img/steallikeaartiste.jpg", title: "Digital Experiment", subtitle: "Procreate / iPad", date: "2026" }
                    ]
                },
                sketches: {
                    title: "Sketches",
                    images: [
                        { src: "/assets/img/steallikeaartiste.jpg", thumb: "/assets/img/steallikeaartiste.jpg", title: "Carnet de croquis", subtitle: "Papier & crayon", date: "2025" }
                    ]
                }
            };

            let currentAlbum = 'typographie';
            let currentImageIndex = 0;

            const albumNav = document.getElementById('albumNav');
            const artViewer = document.getElementById('artViewer');
            const mainImage = document.getElementById('mainImage');
            const viewerPlaceholder = document.getElementById('viewerPlaceholder');
            const artInfo = document.getElementById('artInfo');
            const artTitle = document.getElementById('artTitle');
            const artSubtitle = document.getElementById('artSubtitle');
            const artThumbnails = document.getElementById('artThumbnails');

            function renderAlbum(albumKey) {
                currentAlbum = albumKey;
                const album = albums[albumKey];
                
                // Update active album button
                document.querySelectorAll('.art-album-link').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.album === albumKey);
                    btn.setAttribute('aria-selected', btn.dataset.album === albumKey);
                });

                // Render thumbnails
                artThumbnails.innerHTML = album.images.map((img, idx) => `
                    <div class="art-thumb-wrapper" data-index="${idx}">
                        <img class="art-thumb ${idx === 0 ? 'active' : ''}" 
                             src="${img.thumb}" 
                             alt="${img.title}"
                             data-src="${img.src}"
                             data-title="${img.title}"
                             data-subtitle="${img.subtitle}"
                             loading="lazy">
                        <div class="art-caption">
                            <span class="art-caption-title">${img.title}</span>
                            ${img.subtitle} · ${img.date}
                        </div>
                    </div>
                `).join('');

                // Show first image
                showImage(0);
            }

            function showImage(index) {
                const album = albums[currentAlbum];
                const img = album.images[index];
                
                currentImageIndex = index;
                
                // Update main image
                mainImage.src = img.src;
                mainImage.alt = img.title;
                mainImage.style.display = 'block';
                viewerPlaceholder.style.display = 'none';
                
                // Update info
                artTitle.textContent = img.title;
                artSubtitle.textContent = `${img.subtitle} · ${img.date}`;
                artInfo.style.display = 'block';
                
                // Update thumbnail active state
                document.querySelectorAll('.art-thumb').forEach((thumb, i) => {
                    thumb.classList.toggle('active', i === index);
                });
            }

            // Event delegation for thumbnails
            artThumbnails.addEventListener('click', (e) => {
                const thumb = e.target.closest('.art-thumb');
                if (thumb) {
                    const idx = parseInt(thumb.closest('.art-thumb-wrapper').dataset.index);
                    showImage(idx);
                }
            });

            // Album navigation
            albumNav.addEventListener('click', (e) => {
                const btn = e.target.closest('.art-album-link');
                if (btn) {
                    renderAlbum(btn.dataset.album);
                }
            });

            // Keyboard navigation
            document.addEventListener('keydown', (e) => {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
                
                const album = albums[currentAlbum];
                if (e.key === 'ArrowRight') {
                    showImage((currentImageIndex + 1) % album.images.length);
                } else if (e.key === 'ArrowLeft') {
                    showImage((currentImageIndex - 1 + album.images.length) % album.images.length);
                }
            });

            // Initialize
            renderAlbum('typographie');
        })();
    </script>

                            subtitle: 'Portfolio de design numérique & typographie. Étudiante passionnée par la création de polices et le processus créatif.', 
                            cta: 'À propos de Mellisa' 
                        },
                        blog: { title: 'Blog', readMore: 'Lire la suite', latest: 'Derniers articles', back: '← Retour au blog' }
                    },
                    en: {
                        nav: { about: 'About', games: 'Games', blog: 'Blog', art: 'Art' },
                        hero: { 
                            title: { part1: 'Welcome', part2: 'melissart' }, 
                            subtitle: 'Digital design & typography portfolio. Student passionate about font creation and creative process.', 
                            cta: 'About Mellisa' 
                        },
                        blog: { title: 'Blog', readMore: 'Read more', latest: 'Latest Articles', back: '← Back to blog' }
                    }
                };

                function applyLanguage(lang) {
                    document.documentElement.lang = lang;
                    document.querySelectorAll('[data-i18n]').forEach(el => {
                        const key = el.dataset.i18n;
                        const keys = key.split('.');
                        let value = translations[lang];
                        for (const k of keys) { value = value?.[k]; }
                        if (value) el.textContent = value;
                    });
                    langSpans.forEach(s => s.style.display = s.dataset.lang === lang ? '' : 'none');
                    currentLang = lang;
                    localStorage.setItem('lang', lang);
                }

                if (langToggle) {
                    langToggle.addEventListener('click', () => {
                        applyLanguage(currentLang === 'fr' ? 'en' : 'fr');
                    });
                }

                // Dark mode toggle
                const themeToggle = document.getElementById('themeToggle');
                const themeSpans = themeToggle ? themeToggle.querySelectorAll('[data-theme]') : [];

                function applyTheme(theme) {
                    document.documentElement.setAttribute('data-theme', theme);
                    themeSpans.forEach(s => s.style.display = s.dataset.theme === theme ? '' : 'none');
                    localStorage.setItem('theme', theme);
                }

                if (themeToggle) {
                    themeToggle.addEventListener('click', () => {
                        const current = document.documentElement.getAttribute('data-theme') || 'light';
                        applyTheme(current === 'light' ? 'dark' : 'light');
                    });
                }

                // Initialize from localStorage
                const savedLang = localStorage.getItem('lang');
                if (savedLang) applyLanguage(savedLang);

                const savedTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                applyTheme(savedTheme);
            })();
        </script>
    </body>
</html>
